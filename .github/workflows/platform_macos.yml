name: Platform macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 (arm64)
            runner: macos-15
            architecture: arm64
          - name: macOS 15 (x86_64)
            runner: macos-15-intel
            architecture: x86_64
          - name: macOS 26 (arm64)
            runner: macos-26
            architecture: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Show toolchain
        run: |
          sw_vers
          test "$(uname -m)" = "${{ matrix.architecture }}"
          xcodebuild -version
          c++ --version
          cmake --version
      - name: Configure
        run: cmake -S . -B build -DBYTEPACK_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
