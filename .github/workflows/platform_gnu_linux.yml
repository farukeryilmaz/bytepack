name: Platform GNU/Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Ubuntu 24.04 with GCC 12
            cc: gcc-12
            cxx: g++-12
          - name: Ubuntu 24.04 with Clang 18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Show toolchain
        run: |
          lsb_release --description --short
          "$CC" --version
          "$CXX" --version
          cmake --version
      - name: Configure
        run: cmake -S . -B build -DBYTEPACK_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
